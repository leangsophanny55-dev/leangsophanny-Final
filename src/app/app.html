<!-- Link Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- បង្ហាញ Navbar តែពេលណាដែលមិនមែនជា Page Login ឬ Register -->
<app-navbar *ngIf="showNavbar()"></app-navbar>

<!-- Main Area សម្រាប់ Content Page នីមួយៗ -->
<main>
  <!-- ផ្នែកនេះនឹងបង្ហាញ Content ទៅតាម Route ដែលអ្នកបានកំណត់ (Home, Product, etc.) -->
  <router-outlet></router-outlet>

  <!-- ផ្នែកបង្ហាញផលិតផលទាញយកពី API នៅលើ Home Page -->
  <section class="container py-5" *ngIf="router.url === '/' || router.url === '/home'">
    <h2 class="mb-4">Featured Products</h2>
    <div class="row g-4">
      <div class="col-md-4" *ngFor="let item of products">
        <div class="card h-100 shadow-sm">
          <img [src]="item.image" class="card-img-top" [alt]="item.productName"
            style="height: 200px; object-fit: cover;">
          <div class="card-body">
            <h5 class="card-title">{{ item.productName }}</h5>
            <p class="text-success fw-bold">${{ item.price }}</p>

            <!-- 🟢 បន្ថែម (click)="addToCart(item)" ដើម្បីបញ្ជូនទំនិញចូលកន្ត្រក -->
            <button class="btn btn-outline-primary" (click)="addToCart(item)">
              <i class="bi bi-cart-fill me-1"></i> Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- បង្ហាញ Footer តែពេលណាដែលមិនមែនជា Page Login ឬ Register -->
<app-footer *ngIf="showNavbar()"></app-footer>
