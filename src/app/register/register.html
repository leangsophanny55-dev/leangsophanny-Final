<div class="container-fluid d-flex justify-content-center align-items-center  vh-100  bg-success-subtle">
  <div class="card p-4 shadow-sm border-0 rounded-4" style="width: 100%; max-width: 480px; background-color: #f8f9fa;">

    <h3 class="text-center fw-bold mb-4" style="color: #2e7d32;">Create New Account</h3>

    <form (ngSubmit)="onRegister()">
      <!-- Username -->
      <div class="mb-3 text-start">
        <label class="form-label text-secondary fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-secondary">
            <i class="bi bi-person-fill"></i>
          </span>
          <input type="text" class="form-control bg-white border-start-0 ps-0" [(ngModel)]="username" name="username"
            placeholder="Choose a username" required>
        </div>
      </div>

      <!-- Email Address -->
      <div class="mb-3 text-start">
        <label class="form-label text-secondary fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-secondary">
            <i class="bi bi-envelope-fill"></i>
          </span>
          <input type="email" class="form-control bg-white border-start-0 ps-0" [(ngModel)]="email" name="email"
            placeholder="Enter your email" required>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3 text-start">
        <label class="form-label text-secondary fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-secondary">
            <i class="bi bi-lock-fill"></i>
          </span>
          <input type="password" class="form-control bg-white border-start-0 ps-0" [(ngModel)]="password"
            name="password" placeholder="Create a password" required>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3 text-start">
        <label class="form-label text-secondary fw-semibold">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-secondary">
            <i class="bi bi-lock-fill"></i>
          </span>
          <input type="password" class="form-control bg-white border-start-0 ps-0" [(ngModel)]="confirmPassword"
            name="confirmPassword" placeholder="Confirm your password" required>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="text-danger small mb-3 text-center fw-semibold">
        {{ errorMessage }}
      </div>

      <!-- Buttons -->
      <div class="row g-2 mt-2">
        <div class="col-6">
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" [disabled]="!isFormValid()">
            Register
          </button>
        </div>
        <div class="col-6">
          <button type="button" class="btn btn-danger w-100 py-2 fw-semibold" routerLink="/login">
            Go Login
          </button>
        </div>
      </div>

    </form>

  </div>
</div>
