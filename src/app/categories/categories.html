<!-- បញ្ចូល Bootstrap Icons CDN ប្រសិនបើគម្រោងរបស់អ្នកមិនទាន់មាន -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="container my-5">
  <!-- Section Title -->
  <div class="text-center mb-5">
    <h6 class="text-primary text-uppercase fw-bold tracking-wider mb-2">Explore Our Collections</h6>
    <h2 class="display-6 fw-bold text-dark mb-3">Shop By Category</h2>
    <div class="title-underline mx-auto"></div>
  </div>

  <!-- Categories Grid -->
  <div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let cat of categories">
      <div class="card category-card h-100 border-0 shadow-sm rounded-4 p-3 position-relative overflow-hidden">

        <div class="card-body d-flex align-items-center gap-3">
          <!-- Icon Circle Container -->
          <div class="icon-wrapper d-flex align-items-center justify-content-center rounded-circle flex-shrink-0">
            <i class="bi {{ cat.icon }} fs-2 text-primary"></i>
          </div>

          <!-- Content Info -->
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h5 class="fw-bold mb-0 text-dark category-title">{{ cat.name }}</h5>
            </div>

            <p class="text-muted small mb-2">{{ cat.description }}</p>

            <!-- Badge count & Action arrow -->
            <div class="d-flex justify-content-between align-items-center mt-2">
              <span class="badge bg-light text-primary fw-semibold border border-primary-subtle px-2 py-1 rounded-pill">
                {{ cat.count }}
              </span>
              <span class="arrow-btn text-primary fw-bold">
                <i class="bi bi-arrow-right fs-5"></i>
              </span>
            </div>
          </div>

        </div>

        <!-- Decorative background circle on hover -->
        <div class="hover-bg-circle"></div>
      </div>
    </div>
  </div>
</div>
